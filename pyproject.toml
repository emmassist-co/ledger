[project]
name = "ledger"
version = "0.1.0"
description = "Agent-native archive toolkit for compounding, evidence-first indexes"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "liteparse>=2.0.3",
  "PyYAML>=6.0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
ledger = "ledger.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
