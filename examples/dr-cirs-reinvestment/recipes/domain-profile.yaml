schema_version: 1
domain_name: DR CIRS Reinvestment Archive
domain_slug: dr-cirs-reinvestment
domain_summary: Archive-first operating pack for Portuguese personal-tax reinvestment rule lookup and scoped case application.
risk_class: high
operating_mode: accuracy_first
volatility: annual
fact_sensitivity: required
exception_density: high
exact_wording: critical
source_families:
  - name: statutes
    canonical_source_type: official
    retrieval_unit: article
    persistence_default: on_use
  - name: official_tax_guidance
    canonical_source_type: official
    retrieval_unit: section
    persistence_default: on_use
required_facts:
  - fact_id: residency
    prompt: Is the taxpayer resident in Portugal for the relevant tax year?
    required_for:
      - case_application
  - fact_id: property_use
    prompt: Was the sold property the taxpayer's own permanent home?
    required_for:
      - case_application
  - fact_id: tax_year
    prompt: What tax year or effective period applies?
    required_for:
      - rule_lookup
      - case_application
exception_classes:
  - timing
  - eligibility
  - anti_abuse
answer_sections:
  - rule_found
  - missing_facts
  - evidence_type
  - verified_at
